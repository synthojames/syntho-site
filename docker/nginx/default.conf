# Static file server for the Astro build. TLS terminates at Traefik, so this
# listens on plain HTTP 8080 (the nginx-unprivileged image runs as non-root).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy: emit relative redirects so we never leak :8080 or http://.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Liveness/readiness probe target.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change for a given filename: cache forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Normalize trailing slashes: /about/ -> /about (the homepage is exempt).
    location ~ ^(.+)/$ {
        return 308 $1$is_args$args;
    }

    # Pages: /about -> about.html. Revalidate on each visit so deploys show up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
